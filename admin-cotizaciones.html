<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrar cotizaciones · MakeUpPoint</title><style>body{font:16px Arial,sans-serif;background:#fff9f6;color:#282321;max-width:520px;margin:8vh auto;padding:24px}h1{font-family:Georgia,serif}label{display:block;margin:16px 0 6px}input,button{box-sizing:border-box;width:100%;padding:12px;border:1px solid #d8cbc4;border-radius:6px;font:inherit}button{background:#282321;color:white;margin-top:12px;cursor:pointer}.secondary{background:white;color:#282321}#msg{margin-top:16px}</style></head><body><h1>Cotizaciones MakeUpPoint</h1><p>Marca una cotización vendida o libera las piezas si no se concretó.</p><label for="pass">Contraseña privada</label><input id="pass" type="password" autocomplete="current-password"><label for="folio">Folio</label><input id="folio" inputmode="numeric" placeholder="100"><button onclick="update('sold')">Marcar como vendido</button><button class="secondary" onclick="update('not_sold')">No vendido · liberar piezas</button><div id="msg" role="status"></div><script>async function update(status){const msg=document.querySelector('#msg');msg.textContent='Actualizando…';try{const r=await fetch('/api/quote-status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.querySelector('#pass').value,folio:document.querySelector('#folio').value,status})});const d=await r.json();if(!r.ok)throw Error(d.error||'No se pudo actualizar');msg.textContent=status==='sold'?'Folio '+d.folio+' marcado como vendido.':'Folio '+d.folio+' liberado; piezas de vuelta al inventario.'}catch(e){msg.textContent=e.message}}</script></body></html>
