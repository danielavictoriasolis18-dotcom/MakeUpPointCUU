<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-labelledby="title desc">
<title id="title">Maquillaje para revender</title><desc id="desc">Exhibición de cosméticos en tonos rosas y durazno para una tienda de belleza.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f2d8d0"/><stop offset=".55" stop-color="#d99e98"/><stop offset="1" stop-color="#b97576"/></linearGradient>
 <linearGradient id="glass" x2="1"><stop stop-color="#a55e59"/><stop offset=".22" stop-color="#f1b6a6"/><stop offset=".53" stop-color="#ffe0c9"/><stop offset=".82" stop-color="#d88e83"/><stop offset="1" stop-color="#a65f5c"/></linearGradient>
 <linearGradient id="cream" x2="1" y2="1"><stop stop-color="#fff9ed"/><stop offset=".55" stop-color="#efd8c5"/><stop offset="1" stop-color="#cda68e"/></linearGradient>
 <linearGradient id="rose" x2="1" y2="1"><stop stop-color="#e9969d"/><stop offset="1" stop-color="#9d425a"/></linearGradient>
 <filter id="shadow" x="-40%" y="-30%" width="180%" height="190%"><feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#653f48" flood-opacity=".28"/></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="32"/></filter>
</defs>
<rect width="900" height="700" fill="url(#bg)"/>
<circle cx="515" cy="330" r="286" fill="#f6e1d3" opacity=".82"/>
<ellipse cx="486" cy="604" rx="378" ry="45" fill="#6d3e4a" opacity=".2" filter="url(#soft)"/>
<path d="M0 560C188 525 264 606 414 566s291-16 486 40v94H0z" fill="#b87373" opacity=".28"/>
<!-- Serum bottle -->
<g filter="url(#shadow)" transform="translate(260 150) rotate(-8 95 195)">
 <rect x="68" y="0" width="66" height="72" rx="12" fill="#332c2c"/>
 <rect x="80" y="62" width="42" height="45" rx="8" fill="#d6b3a2"/>
 <rect x="22" y="94" width="158" height="325" rx="38" fill="url(#glass)"/>
 <path d="M43 121q12-14 24-2v250q-8 25-24 4z" fill="#fff" opacity=".23"/>
 <rect x="42" y="218" width="118" height="102" rx="8" fill="#fff8ee" opacity=".78"/>
 <text x="101" y="254" text-anchor="middle" fill="#48383a" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="3">GLOW</text>
 <text x="101" y="281" text-anchor="middle" fill="#8b6965" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">SERUM</text>
 <text x="101" y="303" text-anchor="middle" fill="#8b6965" font-family="Arial,sans-serif" font-size="9" letter-spacing="1">BEAUTY ESSENCE</text>
</g>
<!-- Lip gloss -->
<g filter="url(#shadow)" transform="translate(498 133) rotate(7 76 180)">
 <rect x="42" y="0" width="70" height="90" rx="13" fill="#3b3331"/>
 <rect x="22" y="77" width="110" height="345" rx="30" fill="url(#rose)"/>
 <path d="M39 101q12-14 21 0v269q-8 19-21 0z" fill="#fff" opacity=".22"/>
 <rect x="35" y="221" width="84" height="85" rx="8" fill="#f8e8dc" opacity=".89"/>
 <text x="77" y="254" text-anchor="middle" fill="#53363b" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1">VINYL</text>
 <text x="77" y="276" text-anchor="middle" fill="#775158" font-family="Arial,sans-serif" font-size="9" letter-spacing="1">LIP COLOR</text>
</g>
<!-- blush compact -->
<g filter="url(#shadow)" transform="translate(665 357) rotate(9 94 90)">
 <rect x="0" y="0" width="195" height="174" rx="45" fill="url(#cream)"/>
 <rect x="18" y="20" width="159" height="128" rx="35" fill="url(#rose)"/>
 <ellipse cx="97" cy="84" rx="60" ry="38" fill="#eaa5a6" opacity=".5"/>
 <text x="97" y="111" text-anchor="middle" fill="#fff7ef" font-family="Georgia,serif" font-size="17" font-style="italic">soft blush</text>
</g>
<!-- lipstick -->
<g filter="url(#shadow)" transform="translate(672 92) rotate(13 70 95)">
 <rect x="14" y="55" width="104" height="174" rx="20" fill="#352c2a"/>
 <rect x="23" y="15" width="86" height="85" rx="18" fill="url(#rose)"/>
 <path d="M37 48q12-35 29-35h28v50H37z" fill="#be6874"/>
 <rect x="27" y="133" width="78" height="72" rx="6" fill="#fff7ee" opacity=".9"/>
 <text x="66" y="162" text-anchor="middle" fill="#624349" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1">COLOR</text>
 <text x="66" y="180" text-anchor="middle" fill="#8e6467" font-family="Arial,sans-serif" font-size="8" letter-spacing="1">LIPSTICK</text>
</g>
<!-- wholesale badge -->
<g transform="translate(46 45)">
 <rect width="218" height="54" rx="27" fill="#fff8f0" opacity=".93"/>
 <circle cx="29" cy="27" r="16" fill="#c87978"/><path d="M22 27h14M29 20v14" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
 <text x="57" y="33" fill="#493534" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">MAYOREO PARA REVENTA</text>
</g>
<g fill="#fff7ed" opacity=".9"><path d="M760 75l7 18 18 7-18 7-7 18-7-18-18-7 18-7z"/><path d="M204 452l4 11 11 4-11 4-4 11-4-11-11-4 11-4z"/></g>
</svg>
